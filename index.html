
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b56">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>MeineNotizen</title>

<style>
:root{--blue:#183b56;--bg:#eef3f7;--line:#dce4eb;--muted:#6b7785}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:16px system-ui,Arial;color:#202b36}
header{background:var(--blue);color:white;padding:16px max(16px,calc((100vw - 1050px)/2));display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3}
h1{font-size:22px;margin:0}
header small{opacity:.8}
main{max-width:1050px;margin:auto;padding:16px 16px 70px}
button,input,textarea{font:inherit}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:white;cursor:pointer}
button.secondary{background:#dfe8ef;color:var(--blue)}
button.danger{background:#a83232}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;margin:5px 0 12px}
textarea{min-height:130px;resize:vertical}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}
.panel,.note,.editor{background:white;border:1px solid var(--line);border-radius:13px;padding:15px}
.category{display:block;width:100%;text-align:left;margin:5px 0;background:#edf2f6;color:#183b56}
.category.active{background:var(--blue);color:white}
.note{margin:10px 0}
.note h3{margin:0 0 5px}
.muted{color:var(--muted);font-size:13px}
.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.note img{max-width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin:5px 4px}
.note audio{width:100%;margin:6px 0}
.note-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.editor{margin:12px 0;display:none}
.editor.open{display:block}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.status{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263746;color:white;padding:12px 18px;border-radius:20px;display:none;z-index:9;max-width:90%}
@media(max-width:700px){
.layout{grid-template-columns:1fr}
header{padding:14px}
h1{font-size:19px}
}
</style>
</head>

<body>

<header>
  <div>
    <h1>📝 MeineNotizen</h1>
    <small>Handy und Windows-PC</small>
  </div>
  <button id="loginBtn" class="secondary">Mit Google Drive verbinden</button>
</header>

<main>

<div class="toolbar">
  <button id="newBtn">＋ Neue Notiz</button>
  <button id="syncBtn" class="secondary">↻ Jetzt synchronisieren</button>
  <button id="backupBtn" class="secondary">Datensicherung exportieren</button>
  <button id="restoreBtn" class="secondary">Sicherung importieren</button>
  <input id="restoreInput" type="file" accept=".json,application/json" class="hidden">
</div>

<p id="connection" class="status">
  Google Drive nicht verbunden. Notizen werden lokal gespeichert.
</p>

<section id="editor" class="editor">
  <h2 id="editorHeading">Neue Notiz</h2>

  <label>Titel</label>
  <input id="title" placeholder="Titel der Notiz">

  <label>Kategorie</label>
  <input id="category" list="categoryList" placeholder="z. B. Feuerwehr, Privat, Arbeit">
  <datalist id="categoryList"></datalist>

  <label>Notiztext</label>
  <textarea id="content" placeholder="Deine Gedanken ..."></textarea>

  <label>Erinnerung (Datum und Uhrzeit)</label>
  <input id="reminder" type="datetime-local">

  <label>Bilder / Fotos</label>
  <input id="photos" type="file" accept="image/*" capture="environment" multiple>

  <label>Audiodateien</label>
  <input id="audioFiles" type="file" accept="audio/*" multiple>

  <div class="row">
    <button id="recordBtn" class="secondary">🎙 Aufnahme starten</button>
    <button id="stopBtn" class="secondary" disabled>Aufnahme stoppen</button>
  </div>

  <p id="recordStatus" class="status"></p>
  <div id="oldFiles"></div>

  <div class="toolbar">
    <button id="saveBtn">Speichern</button>
    <button id="cancelBtn" class="secondary">Abbrechen</button>
  </div>
</section>

<div class="layout">
  <aside class="panel">
    <h3>Kategorien</h3>
    <input id="search" placeholder="🔎 Suchen ...">
    <div id="categories"></div>
    <hr>
    <p class="muted">
      Offline lokal verfügbar. Mit Google Drive werden Notizen und Anhänge
      zwischen deinen Geräten abgeglichen.
    </p>
  </aside>

  <section>
    <div id="notes"></div>
    <p id="empty" class="muted hidden">Keine Notizen gefunden.</p>
  </section>
</div>

</main>

<div id="toast"></div>

<!-- Google-Anmeldung -->
<script src="https://accounts.google.com/gsi/client"></script>

<script>
"use strict";

/* =========================================
   GOOGLE EINSTELLUNGEN
========================================= */

const CLIENT_ID =
"730237949135-g2eqlj5emn28pdvhic6t9ti7jq8hdcea.apps.googleusercontent.com";

const SCOPES =
"https://www.googleapis.com/auth/drive.appdata";

const DRIVE_API =
"https://www.googleapis.com/drive/v3";

const UPLOAD_API =
"https://www.googleapis.com/upload/drive/v3";

const CLOUD_FILE = "MeineNotizen.json";

/* =========================================
   LOKALE DATENBANK
========================================= */

const DB = "MeineNotizenDB";
const STORE = "notes";

const DEVICE_ID =
localStorage.getItem("mn-device") ||
(() => {
  let x = crypto.randomUUID();
  localStorage.setItem("mn-device",x);
  return x;
})();

const TOMBSTONE_KEY = "mn-deleted-notes";

let db;
let cache = [];
let editId = null;
let categoryFilter = "Alle";
let pending = [];
let removed = [];
let recorder = null;
let chunks = [];
let stream = null;
let tokenClient = null;
let accessToken = null;
let tokenExpires = 0;
let cloudFileId = null;
let syncTimer = null;
let busy = false;

const $ = id => document.getElementById(id);

/* =========================================
   HILFSFUNKTIONEN
========================================= */

function say(s){
  $("toast").textContent = s;
  $("toast").style.display = "block";
  clearTimeout(say.t);
  say.t = setTimeout(
    () => $("toast").style.display = "none",
    3500
  );
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function status(s){
  $("connection").textContent = s;
}

function getTombstones(){
  try{
    return JSON.parse(localStorage.getItem(TOMBSTONE_KEY)||"{}");
  }catch{
    return {};
  }
}

function saveTombstones(data){
  localStorage.setItem(TOMBSTONE_KEY,JSON.stringify(data));
}

function openDB(){
  return new Promise((ok,no)=>{
    let r = indexedDB.open(DB,1);

    r.onupgradeneeded = () => {
      r.result.createObjectStore(STORE,{keyPath:"id"});
    };

    r.onsuccess = () => {
      db = r.result;
      ok();
    };

    r.onerror = () => no(r.error);
  });
}

function all(){
  return new Promise((ok,no)=>{
    let r = db.transaction(STORE)
      .objectStore(STORE).getAll();

    r.onsuccess = () => ok(r.result||[]);
    r.onerror = () => no(r.error);
  });
}

function put(n){
  return new Promise((ok,no)=>{
    let r = db.transaction(STORE,"readwrite")
      .objectStore(STORE).put(n);

    r.onsuccess = () => ok();
    r.onerror = () => no(r.error);
  });
}

function del(id){
  return new Promise((ok,no)=>{
    let r = db.transaction(STORE,"readwrite")
      .objectStore(STORE).delete(id);

    r.onsuccess = () => ok();
    r.onerror = () => no(r.error);
  });
}

/* =========================================
   NOTIZEN BEARBEITEN
========================================= */

function openEditor(n=null){
  editId = n?.id || null;
  pending = [];
  removed = [];

  $("editorHeading").textContent =
    n ? "Notiz bearbeiten" : "Neue Notiz";

  $("title").value = n?.title || "";
  $("category").value = n?.category || "";
  $("content").value = n?.content || "";
  $("reminder").value = n?.reminder || "";
  $("photos").value = "";
  $("audioFiles").value = "";
  $("recordStatus").textContent = "";
  $("oldFiles").innerHTML = "";

  (n?.attachments||[]).forEach(f=>{
    let b = document.createElement("button");
    b.className = "secondary";
    b.style.margin = "3px";
    b.textContent = "Anhang entfernen: "+f.name;

    b.onclick = () => {
      removed.push(f.id);
      b.remove();
    };

    $("oldFiles").append(b);
  });

  $("editor").classList.add("open");
  scrollTo({top:0,behavior:"smooth"});
}

function closeEditor(){
  $("editor").classList.remove("open");
  editId = null;
  pending = [];
  removed = [];
}

async function saveNote(){
  if(recorder?.state==="recording"){
    say("Bitte zuerst die Aufnahme stoppen.");
    return;
  }

  let title = $("title").value.trim();
  let content = $("content").value.trim();

  if(!title && !content){
    say("Bitte Titel oder Text eingeben.");
    return;
  }

  let old = editId ? cache.find(n=>n.id===editId) : null;

  let attachments =
    (old?.attachments||[]).filter(f=>!removed.includes(f.id));

  for(let f of [
    ...$("photos").files,
    ...$("audioFiles").files,
    ...pending
  ]){
    attachments.push({
      id:crypto.randomUUID(),
      name:f.name||"Sprachnotiz",
      type:f.type||"application/octet-stream",
      blob:f
    });
  }

  await put({
    id:editId||crypto.randomUUID(),
    title,
    content,
    category:$("category").value.trim()||"Allgemein",
    reminder:$("reminder").value,
    attachments,
    created:old?.created||new Date().toISOString(),
    updated:new Date().toISOString(),
    deviceId:DEVICE_ID
  });

  closeEditor();
  await refresh();
  say("Lokal gespeichert.");
  queueSync();
}

async function deleteNote(id){
  if(!confirm("Notiz löschen?")) return;

  await del(id);

  let tombstones = getTombstones();
  tombstones[id] = new Date().toISOString();
  saveTombstones(tombstones);

  await refresh();
  queueSync();
}

/* =========================================
   ANZEIGE UND SUCHE
========================================= */

async function refresh(){
  cache = await all();

  let q = $("search").value.toLowerCase().trim();

  let cats = [
    "Alle",
    ...new Set(cache.map(n=>n.category||"Allgemein"))
  ];

  if(!cats.includes(categoryFilter)) categoryFilter = "Alle";

  $("categories").innerHTML = "";

  cats.forEach(c=>{
    let b = document.createElement("button");
    b.className = "category"+(c===categoryFilter?" active":"");
    b.textContent = c;
    b.onclick = ()=>{
      categoryFilter = c;
      refresh();
    };
    $("categories").append(b);
  });

  $("categoryList").innerHTML =
    cats.slice(1).map(c=>`<option value="${esc(c)}">`).join("");

  let list = cache.filter(n=>
    (categoryFilter==="Alle" ||
      (n.category||"Allgemein")===categoryFilter) &&
    [n.title,n.content,n.category]
      .join(" ").toLowerCase().includes(q)
  ).sort((a,b)=>b.updated.localeCompare(a.updated));

  $("notes").innerHTML = "";
  $("empty").classList.toggle("hidden",list.length>0);

  for(let n of list){
    let el = document.createElement("article");
    el.className = "note";

    el.innerHTML = `
      <h3>${esc(n.title||"Ohne Titel")}</h3>
      <div class="muted">
        ${esc(n.category||"Allgemein")} ·
        ${new Date(n.updated).toLocaleString("de-AT")}
        ${n.reminder ? " · 🔔 "+new Date(n.reminder).toLocaleString("de-AT") : ""}
      </div>
      <p>${esc(n.content)}</p>
      <div class="attachments"></div>
      <div class="note-actions">
        <button data-edit>Bearbeiten</button>
        <button data-delete class="danger">Löschen</button>
      </div>
    `;

    el.querySelector("[data-edit]").onclick =
      ()=>openEditor(n);

    el.querySelector("[data-delete]").onclick =
      ()=>deleteNote(n.id);

    let area = el.querySelector(".attachments");

    for(let f of n.attachments||[]){
      let u = URL.createObjectURL(f.blob);

      if(f.type.startsWith("image/")){
        let im = document.createElement("img");
        im.src = u;
        im.alt = f.name;
        area.append(im);

      }else if(f.type.startsWith("audio/")){
        let au = document.createElement("audio");
        au.controls = true;
        au.src = u;
        area.append(au);

      }else{
        let a = document.createElement("a");
        a.href = u;
        a.download = f.name;
        a.textContent = "📎 "+f.name;
        area.append(a);
      }
    }

    $("notes").append(el);
  }
}

/* =========================================
   SPRACHAUFNAHME
========================================= */

async function startRecording(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    chunks = [];

    recorder.ondataavailable = e=>{
      if(e.data.size) chunks.push(e.data);
    };

    recorder.onstop = ()=>{
      let b = new Blob(chunks,{
        type:recorder.mimeType||"audio/webm"
      });

      pending.push(new File(
        [b],
        "Sprachnotiz-"+Date.now()+".webm",
        {type:b.type}
      ));

      stream?.getTracks().forEach(t=>t.stop());
      stream = null;

      $("recordStatus").textContent =
        "Aufnahme angehängt – beim Speichern übernehmen.";

      $("recordBtn").disabled = false;
      $("stopBtn").disabled = true;
    };

    recorder.start();
    $("recordBtn").disabled = true;
    $("stopBtn").disabled = false;
    $("recordStatus").textContent = "● Aufnahme läuft ...";

  }catch(e){
    say("Mikrofonzugriff nicht möglich: "+e.message);
  }
}

function stopRecording(){
  if(recorder?.state==="recording") recorder.stop();
}

/* =========================================
   DATENSICHERUNG
========================================= */

function to64(blob){
  return new Promise((ok,no)=>{
    let r = new FileReader();

    r.onload = ()=>ok(r.result.split(",")[1]);
    r.onerror = no;
    r.readAsDataURL(blob);
  });
}

async function exportData(){
  let notes = [];

  for(let n of await all()){
    let at = [];

    for(let f of n.attachments||[]){
      at.push({
        id:f.id,
        name:f.name,
        type:f.type,
        data:await to64(f.blob)
      });
    }

    notes.push({...n,attachments:at});
  }

  return {
    format:"MeineNotizen",
    schema:1,
    exportedAt:new Date().toISOString(),
    notes
  };
}

async function importData(d){
  if(d.format!=="MeineNotizen" || !Array.isArray(d.notes)){
    throw Error("Ungültige Sicherungsdatei");
  }

  let tombstones = getTombstones();

  for(let n of d.notes){
    let at = [];

    for(let f of n.attachments||[]){
      let bytes = Uint8Array.from(
        atob(f.data),
        c=>c.charCodeAt(0)
      );

      at.push({
        id:f.id||crypto.randomUUID(),
        name:f.name,
        type:f.type,
        blob:new Blob([bytes],{type:f.type})
      });
    }

    await put({...n,attachments:at});
    delete tombstones[n.id];
  }

  saveTombstones(tombstones);
  await refresh();
}

async function backup(){
  try{
    let blob = new Blob(
      [JSON.stringify(await exportData())],
      {type:"application/json"}
    );

    let u = URL.createObjectURL(blob);
    let a = document.createElement("a");

    a.href = u;
    a.download = "MeineNotizen-Sicherung.json";
    a.click();

    URL.revokeObjectURL(u);

  }catch(e){
    say("Exportfehler: "+e.message);
  }
}

/* =========================================
   GOOGLE AUTHENTIFIZIERUNG
========================================= */

function initAuth(){
  if(!window.google?.accounts?.oauth2){
    status("Google-Anmeldemodul konnte nicht geladen werden. Internetverbindung prüfen.");
    return;
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:SCOPES,

    callback:(response)=>{
      if(response.error){
        status("Google-Anmeldung fehlgeschlagen: "+response.error);
        say("Google-Anmeldung fehlgeschlagen.");
        return;
      }

      accessToken = response.access_token;
      tokenExpires = Date.now()+(response.expires_in||3600)*1000;

      status("Google Drive verbunden.");
      $("loginBtn").textContent = "Google Drive verbunden";

      syncNow();
    },

    error_callback:(error)=>{
      say("Google-Anmeldung konnte nicht abgeschlossen werden.");
      console.error(error);
    }
  });

  status("Google Drive nicht verbunden. Notizen werden lokal gespeichert.");
}

function signIn(){
  if(!tokenClient){
    initAuth();
  }

  if(!tokenClient){
    say("Google-Anmeldung ist noch nicht verfügbar.");
    return;
  }

  tokenClient.requestAccessToken({
    prompt:"consent"
  });
}

function hasToken(){
  return !!accessToken && Date.now()<tokenExpires-60000;
}

/* =========================================
   GOOGLE DRIVE API
========================================= */

async function driveRequest(url,options={}){
  if(!hasToken()){
    throw Error("Google-Anmeldung abgelaufen. Bitte erneut verbinden.");
  }

  let r = await fetch(url,{
    ...options,
    headers:{
      Authorization:"Bearer "+accessToken,
      ...(options.headers||{})
    }
  });

  if(r.status===401){
    accessToken = null;
    tokenExpires = 0;
    $("loginBtn").textContent = "Mit Google Drive verbinden";
    throw Error("Google-Anmeldung abgelaufen. Bitte erneut verbinden.");
  }

  if(!r.ok){
    let message = await r.text();
    throw Error("Google Drive "+r.status+": "+message.slice(0,250));
  }

  if(r.status===204) return null;

  let ct = r.headers.get("content-type")||"";

  if(ct.includes("json")) return r.json();

  return r.text();
}

/* =========================================
   CLOUD DATEI FINDEN
========================================= */

async function findCloudFile(){
  if(cloudFileId) return cloudFileId;

  let q = encodeURIComponent(
    "name='"+CLOUD_FILE+"' and trashed=false"
  );

  let url =
    DRIVE_API+
    "/files?spaces=appDataFolder&q="+q+
    "&fields=files(id,name)";

  let result = await driveRequest(url);

  if(result.files?.length){
    cloudFileId = result.files[0].id;
    return cloudFileId;
  }

  return null;
}

/* =========================================
   CLOUD DATEI LESEN
========================================= */

async function readCloud(){
  let id = await findCloudFile();

  if(!id) return null;

  let url =
    DRIVE_API+"/files/"+encodeURIComponent(id)+"?alt=media";

  let result = await driveRequest(url);

  if(typeof result==="string"){
    return JSON.parse(result);
  }

  return result;
}

/* =========================================
   CLOUD DATEI SCHREIBEN
========================================= */

async function writeCloud(data){
  let id = await findCloudFile();

  if(!id){
    let created = await driveRequest(
      DRIVE_API+"/files?fields=id",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          name:CLOUD_FILE,
          mimeType:"application/json",
          parents:["appDataFolder"]
        })
      }
    );

    id = created.id;
    cloudFileId = id;
  }

  await driveRequest(
    UPLOAD_API+"/files/"+encodeURIComponent(id)+"?uploadType=media",
    {
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    }
  );
}

/* =========================================
   DATEN FÜR GOOGLE DRIVE
========================================= */

async function exportCloudData(){
  let data = await exportData();

  return {
    ...data,
    tombstones:getTombstones()
  };
}

/* =========================================
   SYNCHRONISATION / ZUSAMMENFÜHREN
========================================= */

async function mergeCloud(cloud){
  if(!cloud || !Array.isArray(cloud.notes)) return;

  let local = await all();
  let tombstones = getTombstones();

  // Löschinformationen übernehmen
  for(let [id,time] of Object.entries(cloud.tombstones||{})){
    if(!tombstones[id] || time>tombstones[id]){
      tombstones[id] = time;
    }
  }

  // Lokale Notizen mit Löschinformationen vergleichen
  for(let n of local){
    let deletedAt = tombstones[n.id];

    if(deletedAt && deletedAt>=n.updated){
      await del(n.id);
    }
  }

  // Cloud-Notizen übernehmen
  for(let remote of cloud.notes){
    let deletedAt = tombstones[remote.id];

    if(deletedAt && deletedAt>=remote.updated){
      continue;
    }

    let current = (await all()).find(n=>n.id===remote.id);

    if(!current || new Date(remote.updated)>new Date(current.updated)){
      let attachments = [];

      for(let f of remote.attachments||[]){
        let bytes = Uint8Array.from(
          atob(f.data),
          c=>c.charCodeAt(0)
        );

        attachments.push({
          id:f.id,
          name:f.name,
          type:f.type,
          blob:new Blob([bytes],{type:f.type})
        });
      }

      await put({...remote,attachments});
    }

    if(!deletedAt || remote.updated>deletedAt){
      delete tombstones[remote.id];
    }
  }

  saveTombstones(tombstones);
}

/* =========================================
   SYNCHRONISIEREN
========================================= */

async function syncNow(){
  if(!hasToken()){
    say("Bitte zuerst Google Drive verbinden.");
    return;
  }

  if(busy) return;

  busy = true;
  status("Google Drive: synchronisiere ...");

  try{
    let cloud = await readCloud();

    await mergeCloud(cloud);

    let data = await exportCloudData();

    await writeCloud(data);

    localStorage.setItem(
      "mn-last-sync",
      new Date().toISOString()
    );

    status(
      "Google Drive synchronisiert · "+
      new Date().toLocaleTimeString("de-AT")
    );

    await refresh();

  }catch(e){
    status("Google-Drive-Synchronisation fehlgeschlagen: "+e.message);
    say("Synchronisationsfehler: "+e.message);
    console.error(e);

  }finally{
    busy = false;
  }
}

function queueSync(){
  if(!hasToken()) return;

  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow,1500);
}

/* =========================================
   BEDIENELEMENTE
========================================= */

$("loginBtn").onclick = signIn;
$("syncBtn").onclick = syncNow;
$("newBtn").onclick = ()=>openEditor();
$("saveBtn").onclick = saveNote;
$("cancelBtn").onclick = closeEditor;
$("recordBtn").onclick = startRecording;
$("stopBtn").onclick = stopRecording;
$("backupBtn").onclick = backup;
$("search").oninput = refresh;

$("restoreBtn").onclick = ()=>$("restoreInput").click();

$("restoreInput").onchange = async e=>{
  try{
    await importData(
      JSON.parse(await e.target.files[0].text())
    );

    queueSync();
    say("Sicherung importiert.");

  }catch(x){
    say("Importfehler: "+x.message);
  }

  e.target.value = "";
};

/* =========================================
   START DER APP
========================================= */

async function boot(){
  await openDB();
  await refresh();

  initAuth();

  if("serviceWorker" in navigator && location.protocol==="https:"){
    navigator.serviceWorker.register("./service-worker.js")
      .catch(console.warn);
  }

  // Erinnerungen laufen, solange die App geöffnet ist.
  setInterval(async()=>{
    if(!("Notification" in window) ||
       Notification.permission!=="granted") return;

    for(let n of await all()){
      let k = "rem-"+n.id+"-"+n.reminder;

      if(n.reminder &&
         new Date(n.reminder).getTime()<=Date.now() &&
         !localStorage.getItem(k)){

        new Notification("MeineNotizen",{
          body:n.title||"Erinnerung"
        });

        localStorage.setItem(k,"1");
      }
    }
  },30000);

  // Regelmäßige Synchronisation im Vordergrund
  setInterval(()=>{
    if(hasToken() && document.visibilityState==="visible"){
      syncNow();
    }
  },60000);
}

boot().catch(e=>{
  say("Startfehler: "+e.message);
  console.error(e);
});

</script>
</body>
</html>
