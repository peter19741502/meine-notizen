<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b56"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>MeineNotizen</title>
<style>
:root{--blue:#183b56;--bg:#eef3f7;--line:#dce4eb;--muted:#6b7785}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px system-ui,Arial;color:#202b36}
header{background:var(--blue);color:white;padding:16px max(16px,calc((100vw - 1050px)/2));display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:3}
h1{font-size:22px;margin:0}header small{opacity:.8}main{max-width:1050px;margin:auto;padding:16px 16px 70px}
button,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 14px;background:var(--blue);color:white;cursor:pointer}
button.secondary{background:#dfe8ef;color:var(--blue)}button.danger{background:#a83232}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;margin:5px 0 12px}
textarea{min-height:130px;resize:vertical}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}.panel,.note,.editor{background:white;border:1px solid var(--line);border-radius:13px;padding:15px}
.category{display:block;width:100%;text-align:left;margin:5px 0;background:#edf2f6;color:#183b56}.category.active{background:var(--blue);color:white}
.note{margin:10px 0}.note h3{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.note p{white-space:pre-wrap;overflow-wrap:anywhere}
.note img{max-width:100%;max-height:260px;object-fit:contain;border-radius:8px;margin:5px 4px}.note audio{width:100%;margin:6px 0}
.note-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.editor{margin:12px 0;display:none}.editor.open{display:block}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.status{font-size:13px;color:var(--muted)}.hidden{display:none!important}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263746;color:white;padding:12px 18px;border-radius:20px;display:none;z-index:9;max-width:90%}
@media(max-width:700px){.layout{grid-template-columns:1fr}header{padding:14px}h1{font-size:19px}}
</style></head>
<body>
<header><div><h1>📝 MeineNotizen</h1><small>Handy und Windows-PC</small></div><button id="loginBtn" class="secondary">Mit OneDrive verbinden</button></header>
<main>
<div class="toolbar"><button id="newBtn">＋ Neue Notiz</button><button id="syncBtn" class="secondary">↻ Jetzt synchronisieren</button><button id="backupBtn" class="secondary">Datensicherung exportieren</button><button id="restoreBtn" class="secondary">Sicherung importieren</button><input id="restoreInput" type="file" accept=".json,application/json" class="hidden"></div>
<p id="connection" class="status">OneDrive nicht verbunden. Notizen werden lokal gespeichert.</p>
<section id="editor" class="editor">
<h2 id="editorHeading">Neue Notiz</h2><label>Titel</label><input id="title" placeholder="Titel der Notiz">
<label>Kategorie</label><input id="category" list="categoryList" placeholder="z. B. Feuerwehr, Privat, Arbeit"><datalist id="categoryList"></datalist>
<label>Notiztext</label><textarea id="content" placeholder="Deine Gedanken ..."></textarea>
<label>Erinnerung (Datum und Uhrzeit)</label><input id="reminder" type="datetime-local">
<label>Bilder / Fotos</label><input id="photos" type="file" accept="image/*" capture="environment" multiple>
<label>Audiodateien</label><input id="audioFiles" type="file" accept="audio/*" multiple>
<div class="row"><button id="recordBtn" class="secondary">🎙 Aufnahme starten</button><button id="stopBtn" class="secondary" disabled>Aufnahme stoppen</button></div><p id="recordStatus" class="status"></p><div id="oldFiles"></div>
<div class="toolbar"><button id="saveBtn">Speichern</button><button id="cancelBtn" class="secondary">Abbrechen</button></div></section>
<div class="layout"><aside class="panel"><h3>Kategorien</h3><input id="search" placeholder="🔎 Suchen ..."><div id="categories"></div><hr><p class="muted">Offline lokal verfügbar. Mit OneDrive werden Notizen und Anhänge zwischen Geräten abgeglichen.</p></aside><section><div id="notes"></div><p id="empty" class="muted hidden">Keine Notizen gefunden.</p></section></div>
</main><div id="toast"></div>
<script src="https://alcdn.msauth.net/browser/3.28.1/js/msal-browser.min.js"></script>
<script>
"use strict";
/* Microsoft Entra Einrichtung: App registrieren, Plattform SPA, HTTPS-Redirect-URI.
   Delegierte Graph-Berechtigung: Files.ReadWrite.AppFolder. Keine Client-Secrets hier eintragen. */
const CLIENT_ID="HIER-DEINE-CLIENT-ID-EINTRAGEN";
const TENANT_ID="common";
const SCOPES=["Files.ReadWrite.AppFolder"];
const ROOT="/me/drive/special/approot";
const DB="MeineNotizenDB",STORE="notes",DEVICE_ID=localStorage.getItem("mn-device")||(()=>{let x=crypto.randomUUID();localStorage.setItem("mn-device",x);return x})();
let db,cache=[],editId=null,categoryFilter="Alle",pending=[],removed=[],recorder=null,chunks=[],stream=null,msal=null,account=null,syncTimer=null,busy=false;
const $=id=>document.getElementById(id);
function say(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(say.t);say.t=setTimeout(()=>$("toast").style.display="none",3500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id"});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function all(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}
function put(n){return new Promise((ok,no)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).put(n);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function del(id){return new Promise((ok,no)=>{let r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function openEditor(n=null){editId=n?.id||null;pending=[];removed=[];$("editorHeading").textContent=n?"Notiz bearbeiten":"Neue Notiz";$("title").value=n?.title||"";$("category").value=n?.category||"";$("content").value=n?.content||"";$("reminder").value=n?.reminder||"";$("photos").value="";$("audioFiles").value="";$("recordStatus").textContent="";$("oldFiles").innerHTML="";(n?.attachments||[]).forEach(f=>{let b=document.createElement("button");b.className="secondary";b.style.margin="3px";b.textContent="Anhang entfernen: "+f.name;b.onclick=()=>{removed.push(f.id);b.remove()};$("oldFiles").append(b)});$("editor").classList.add("open");scrollTo({top:0,behavior:"smooth"})}
function closeEditor(){$("editor").classList.remove("open");editId=null;pending=[];removed=[]}
async function saveNote(){if(recorder?.state==="recording"){say("Bitte zuerst die Aufnahme stoppen.");return}let title=$("title").value.trim(),content=$("content").value.trim();if(!title&&!content){say("Bitte Titel oder Text eingeben.");return}
let old=editId?cache.find(n=>n.id===editId):null,attachments=(old?.attachments||[]).filter(f=>!removed.includes(f.id));
for(let f of [...$("photos").files,...$("audioFiles").files,...pending])attachments.push({id:crypto.randomUUID(),name:f.name||"Sprachnotiz",type:f.type||"application/octet-stream",blob:f});
await put({id:editId||crypto.randomUUID(),title,content,category:$("category").value.trim()||"Allgemein",reminder:$("reminder").value,attachments,created:old?.created||new Date().toISOString(),updated:new Date().toISOString(),deviceId:DEVICE_ID});
closeEditor();await refresh();say("Lokal gespeichert.");queueSync()}
async function refresh(){cache=await all();let q=$("search").value.toLowerCase().trim(),cats=["Alle",...new Set(cache.map(n=>n.category||"Allgemein"))];if(!cats.includes(categoryFilter))categoryFilter="Alle";$("categories").innerHTML="";cats.forEach(c=>{let b=document.createElement("button");b.className="category"+(c===categoryFilter?" active":"");b.textContent=c;b.onclick=()=>{categoryFilter=c;refresh()};$("categories").append(b)});$("categoryList").innerHTML=cats.slice(1).map(c=>`<option value="${esc(c)}">`).join("");
let list=cache.filter(n=>(categoryFilter==="Alle"||(n.category||"Allgemein")===categoryFilter)&&[n.title,n.content,n.category].join(" ").toLowerCase().includes(q)).sort((a,b)=>b.updated.localeCompare(a.updated));$("notes").innerHTML="";$("empty").classList.toggle("hidden",list.length>0);
for(let n of list){let el=document.createElement("article");el.className="note";el.innerHTML=`<h3>${esc(n.title||"Ohne Titel")}</h3><div class="muted">${esc(n.category||"Allgemein")} · ${new Date(n.updated).toLocaleString("de-AT")}${n.reminder?" · 🔔 "+new Date(n.reminder).toLocaleString("de-AT"):""}</div><p>${esc(n.content)}</p><div class="attachments"></div><div class="note-actions"><button data-edit>Bearbeiten</button><button data-delete class="danger">Löschen</button></div>`;el.querySelector("[data-edit]").onclick=()=>openEditor(n);el.querySelector("[data-delete]").onclick=async()=>{if(confirm("Notiz löschen?")){await del(n.id);await refresh();queueSync()}};let area=el.querySelector(".attachments");for(let f of n.attachments||[]){let u=URL.createObjectURL(f.blob);if(f.type.startsWith("image/")){let im=document.createElement("img");im.src=u;im.alt=f.name;area.append(im)}else if(f.type.startsWith("audio/")){let au=document.createElement("audio");au.controls=true;au.src=u;area.append(au)}else{let a=document.createElement("a");a.href=u;a.download=f.name;a.textContent="📎 "+f.name;area.append(a)}}$("notes").append(el)}}
async function startRecording(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{let b=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});pending.push(new File([b],"Sprachnotiz-"+Date.now()+".webm",{type:b.type}));stream?.getTracks().forEach(t=>t.stop());stream=null;$("recordStatus").textContent="Aufnahme angehängt – beim Speichern übernehmen.";$("recordBtn").disabled=false;$("stopBtn").disabled=true};recorder.start();$("recordBtn").disabled=true;$("stopBtn").disabled=false;$("recordStatus").textContent="● Aufnahme läuft ..."}catch(e){say("Mikrofonzugriff nicht möglich: "+e.message)}}
function stopRecording(){if(recorder?.state==="recording")recorder.stop()}
function to64(blob){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(blob)})}
async function exportData(){let notes=[];for(let n of await all()){let at=[];for(let f of n.attachments||[])at.push({id:f.id,name:f.name,type:f.type,data:await to64(f.blob)});notes.push({...n,attachments:at})}return{format:"MeineNotizen",schema:1,exportedAt:new Date().toISOString(),notes}}
async function importData(d){if(d.format!=="MeineNotizen"||!Array.isArray(d.notes))throw Error("Ungültige Sicherungsdatei");for(let n of d.notes){let at=[];for(let f of n.attachments||[]){let bytes=Uint8Array.from(atob(f.data),c=>c.charCodeAt(0));at.push({id:f.id||crypto.randomUUID(),name:f.name,type:f.type,blob:new Blob([bytes],{type:f.type})})}await put({...n,attachments:at})}await refresh()}
async function backup(){try{let blob=new Blob([JSON.stringify(await exportData())],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="MeineNotizen-Sicherung.json";a.click();URL.revokeObjectURL(u)}catch(e){say("Exportfehler: "+e.message)}}
$("restoreBtn").onclick=()=>$("restoreInput").click();$("restoreInput").onchange=async e=>{try{await importData(JSON.parse(await e.target.files[0].text()));queueSync();say("Sicherung importiert.")}catch(x){say("Importfehler: "+x.message)}e.target.value=""};
/* Microsoft Graph */
function configured(){return CLIENT_ID!=="HIER-DEINE-CLIENT-ID-EINTRAGEN"}
function status(s){$("connection").textContent=s}
async function initAuth(){if(!configured()){status("OneDrive noch nicht eingerichtet: CLIENT_ID in index.html eintragen.");return}if(!window.msal){status("Microsoft-Anmeldemodul konnte nicht geladen werden.");return}msal=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/"+TENANT_ID,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});await msal.initialize();let a=msal.getAllAccounts();if(a.length){account=a[0];status("OneDrive angemeldet: "+account.username);await syncNow()}}
async function signIn(){if(!configured()){say("Zuerst CLIENT_ID in index.html eintragen.");return}try{if(!msal)await initAuth();let r=await msal.loginPopup({scopes:SCOPES});account=r.account;status("OneDrive angemeldet: "+account.username);await syncNow()}catch(e){say("Microsoft-Anmeldung fehlgeschlagen: "+e.message)}}
async function accessToken(){try{return(await msal.acquireTokenSilent({scopes:SCOPES,account})).accessToken}catch{return(await msal.acquireTokenPopup({scopes:SCOPES,account})).accessToken}}
async function graph(path,options={}){let t=await accessToken(),r=await fetch("https://graph.microsoft.com/v1.0"+path,{...options,headers:{Authorization:"Bearer "+t,...(options.headers||{})}});if(!r.ok)throw Error("Graph "+r.status+": "+(await r.text()).slice(0,250));if(r.status===204)return null;let ct=r.headers.get("content-type")||"";return ct.includes("json")?r.json():r.text()}
async function readCloud(){try{return await graph(ROOT+":/MeineNotizen.json:/content")}catch(e){if(String(e.message).includes("Graph 404"))return null;throw e}}
async function mergeCloud(cloud){if(!cloud?.notes)return;let local=await all(),map=new Map(local.map(n=>[n.id,n]));for(let remote of cloud.notes){let here=map.get(remote.id);if(!here||new Date(remote.updated)>new Date(here.updated)){let attachments=[];for(let f of remote.attachments||[]){let bytes=Uint8Array.from(atob(f.data),c=>c.charCodeAt(0));attachments.push({id:f.id,name:f.name,type:f.type,blob:new Blob([bytes],{type:f.type})})}await put({...remote,attachments})}}}
async function syncNow(){if(!account){say("Verbinde zuerst OneDrive.");return}if(busy)return;busy=true;status("OneDrive: synchronisiere ...");try{
 let cloud=await readCloud();await mergeCloud(cloud);
 // Re-export after merge. Per-note updated timestamp provides last-write-wins merge.
 let data=await exportData();await graph(ROOT+":/MeineNotizen.json:/content",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
 localStorage.setItem("mn-last-sync",new Date().toISOString());status("OneDrive synchronisiert · "+new Date().toLocaleTimeString("de-AT"));await refresh();
 }catch(e){status("OneDrive-Synchronisation fehlgeschlagen: "+e.message);say("Synchronisationsfehler: "+e.message)}finally{busy=false}}
function queueSync(){if(!account)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}
$("loginBtn").onclick=signIn;$("syncBtn").onclick=syncNow;$("newBtn").onclick=()=>openEditor();$("saveBtn").onclick=saveNote;$("cancelBtn").onclick=closeEditor;$("recordBtn").onclick=startRecording;$("stopBtn").onclick=stopRecording;$("backupBtn").onclick=backup;$("search").oninput=refresh;
async function boot(){await openDB();await refresh();await initAuth();if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./service-worker.js").catch(console.warn);
 // Browser reminders run while the app is open. Closed-app alarms need a separate push service/native app.
 setInterval(async()=>{if(!("Notification"in window)||Notification.permission!=="granted")return;for(let n of await all()){let k="rem-"+n.id+"-"+n.reminder;if(n.reminder&&new Date(n.reminder).getTime()<=Date.now()&&!localStorage.getItem(k)){new Notification("MeineNotizen",{body:n.title||"Erinnerung"});localStorage.setItem(k,"1")}}},30000)}
// Neue oder geänderte Notizen auf dem jeweils anderen Gerät regelmäßig abrufen.
 // Das ist Synchronisation in Intervallen, keine Echtzeit-Synchronisation.
setInterval(()=>{if(account && document.visibilityState==="visible")syncNow()},60000);
boot().catch(e=>say("Startfehler: "+e.message));
</script></body></html>
